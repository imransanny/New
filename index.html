document.querySelectorAll('a[data-link]').forEach(a=>{const href=a.getAttribute('href');if(href&&href.startsWith('/'))a.setAttribute('href','#'+href)})}
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function add(id){let p=products.find(p=>p.id===id);if(!p)return;let s=route.startsWith('/product/')?size:'M';let item=cart.find(x=>x.id===id&&x.size===s);if(item){if(item.qty>=50){toast('Maximum 50 units per size');return}item.qty++}else cart.push({id,size:s,qty:1});save();render();toast(p.name+' added to your bag')}
document.addEventListener('click',e=>{let link=e.target.closest('[data-link]');if(link){e.preventDefault();drawer='';go(link.getAttribute('href'));return}let a=e.target.closest('[data-action]');if(a){let v=a.dataset.action;if(v==='newsletter'){e.preventDefault();drawer='';if(route!=='/')go('/');document.querySelector('#newsletter')?.scrollIntoView({behavior:'smooth'});return}if(v==='checkout'){window.location.href='app.html#checkout';return}if(v==='account'){window.location.href='app.html';return}drawer=v==='close'?'':v;render();return}let addBtn=e.target.closest('[data-add]');if(addBtn){add(Number(addBtn.dataset.add));return}let fav=e.target.closest('[data-fav]');if(fav){let id=Number(fav.dataset.fav);favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];save();render();toast(favorites.includes(id)?'Added to wishlist':'Removed from wishlist');return}let cat=e.target.closest('[data-category]');if(cat){drawer='';go('/shop'+(cat.dataset.category==='ALL'?'':'?category='+encodeURIComponent(cat.dataset.category)));return}let sz=e.target.closest('[data-size]');if(sz){size=sz.dataset.size;render();return}let q=e.target.closest('[data-qty]');if(q){let [id,s,d]=q.dataset.qty.split('|');let item=cart.find(x=>x.id===Number(id)&&x.size===s);if(item){item.qty=Math.min(50,item.qty+Number(d));if(item.qty<=0)cart=cart.filter(x=>x!==item)}save();render();return}let rem=e.target.closest('[data-remove]');if(rem){let [id,s]=rem.dataset.remove.split('|');cart=cart.filter(x=>x.id!==Number(id)||x.size!==s);save();render();return}let sl=e.target.closest('[data-slide]');if(sl){slide=Number(sl.dataset.slide);render();return}});
document.addEventListener('change',e=>{if(e.target.id==='sort-select'){let url=routeURL();url.searchParams.set('sort',e.target.value);go(url.pathname+url.search)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drawer){drawer='';render()}});
document.addEventListener('submit',e=>{if(e.target.id==='newsletter-form'){e.preventDefault();toast('Newsletter preview only — email signup is not connected yet.');return}if(e.target.id==='search-form'){e.preventDefault();let val=new FormData(e.target).get('q');drawer='';go('/shop?q='+encodeURIComponent(val));return}if(e.target.id==='contact-form'){e.preventDefault();toast('Demo only: connect a form service to send messages.')}});
resolve();
// Public catalogue synchronization. Supabase RLS allows anonymous reads of active products only.
window.TOMATO_SYNC_CATALOG = function(rows) {
 if (!Array.isArray(rows)) return;
 const prior = [...products];
 const valid=rows.filter(p=>p && p.active && Number(p.price)>0 && Number.isInteger(Number(p.id)));
 const mapped=valid.map(p=>{
   const id=Number.isInteger(p.catalog_key)&&p.catalog_key>0?p.catalog_key:1000000+Number(p.id);
   const legacy=prior.find(x=>x.id===id);
   let imageName='iv-feature-1.webp';
   if (typeof p.image_path==='string') {
     if (/^assets\/[a-zA-Z0-9_.-]+\.webp$/.test(p.image_path)) imageName=p.image_path.slice(7);
     else if (/^https:\/\/[\w./?&=%+-]+$/i.test(p.image_path)) {imageName='remote-'+Number(p.id);assets[imageName]=p.image_path}
   }
   if(!assets[imageName]) imageName='iv-feature-1.webp';
   if(!categories.some(c=>c[0]===p.category)) categories.push([String(p.category),'New collection']);
   return {id,name:String(p.name||'Style'),price:Number(p.price),old:Number(p.compare_at)||Number(p.price),category:String(p.category||'Clothing'),image:imageName,colors:legacy?.colors||['#9a161c','#e9d9d2'],rating:legacy?.rating||4.8,reviews:legacy?.reviews||0,tag:'Collection'};
 });
 products.splice(0,products.length,...mapped);
 cart=cart.filter(x=>products.some(p=>p.id===x.id));save();render();
};
